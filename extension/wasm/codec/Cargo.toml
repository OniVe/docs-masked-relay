[package]
name = "codec"
version = "0.1.0"
edition = "2021"
description = "ZIP/DEFLATE codec for DocsMasked OPC packages (raw ABI, no wasm-bindgen)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
miniz_oxide = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
