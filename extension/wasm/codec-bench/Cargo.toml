[package]
name = "codec-bench"
version = "0.1.0"
edition = "2021"
description = "P1 benchmark-only WASM codecs (quick-xml + miniz_oxide) for ROI measurement"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
quick-xml = "0.38"
miniz_oxide = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
