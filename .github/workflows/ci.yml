name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        working-directory: extension
        run: bun install --frozen-lockfile

      - name: Check and test
        working-directory: extension
        run: bun run ci

      - name: Build
        working-directory: extension
        run: bun run build

      - name: Package
        working-directory: extension
        run: bun run zip

      - name: Upload Chrome package
        uses: actions/upload-artifact@v4
        with:
          name: docs-masked-relay-chrome
          path: extension/.output/*.zip
          if-no-files-found: error
          retention-days: 14
